{% if editable %}<button type="button" class="tooth {{ t.kind }}" data-tooth="{{ t.code }}" title="Tooth {{ t.code }}"><span class="no">{{ t.code }}</span><span class="marks">{% for c in t.conditions %}{{ c.abbr }}{% if not forloop.last %} {% endif %}{% endfor %}</span></button>{% else %}<span class="tooth {{ t.kind }}" title="Tooth {{ t.code }}{% for c in t.conditions %}{% if forloop.first %}: {% else %}, {% endif %}{{ c.label }}{% endfor %}"><span class="no">{{ t.code }}</span><span class="marks">{% for c in t.conditions %}{{ c.abbr }}{% if not forloop.last %} {% endif %}{% endfor %}</span></span>{% endif %}
