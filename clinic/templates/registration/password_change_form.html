{% extends "clinic/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<div class="card" style="max-width:480px">
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "clinic/_field.html" %}<div style="height:.75rem"></div>{% endfor %}
    <div class="form-actions"><button class="btn primary" type="submit">Change password</button></div>
  </form>
</div>
{% endblock %}
